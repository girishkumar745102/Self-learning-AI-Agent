<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <svg class="synapse" viewBox="0 0 48 48" width="34" height="34">
          <line x1="10" y1="14" x2="24" y2="34" class="synapse-line l1"/>
          <line x1="24" y1="34" x2="38" y2="14" class="synapse-line l2"/>
          <line x1="10" y1="14" x2="38" y2="14" class="synapse-line l3"/>
          <circle cx="10" cy="14" r="4" class="synapse-node n1"/>
          <circle cx="38" cy="14" r="4" class="synapse-node n2"/>
          <circle cx="24" cy="34" r="4" class="synapse-node n3"/>
        </svg>
        <div class="brand-text">
          <h1>EvoMind</h1>
          <p>an evolving assistant, built by NeuraCraft</p>
        </div>
      </div>
      <div class="session-tag" id="session-tag">session · ...</div>
    </header>

    <main class="chat-window" id="chat-window">
      <div class="empty-state" id="empty-state">
        <svg class="synapse synapse-big" viewBox="0 0 48 48" width="46" height="46">
          <line x1="10" y1="14" x2="24" y2="34" class="synapse-line l1"/>
          <line x1="24" y1="34" x2="38" y2="14" class="synapse-line l2"/>
          <line x1="10" y1="14" x2="38" y2="14" class="synapse-line l3"/>
          <circle cx="10" cy="14" r="4" class="synapse-node n1"/>
          <circle cx="38" cy="14" r="4" class="synapse-node n2"/>
          <circle cx="24" cy="34" r="4" class="synapse-node n3"/>
        </svg>
        <p class="empty-title">Nothing remembered yet</p>
        <p class="empty-sub">Tell EvoMind something about yourself — it'll recall it later in this session.</p>
      </div>
    </main>

    <div class="typing-indicator" id="typing-indicator">
      <span class="typing-label">recalling</span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <form class="input-bar" id="chat-form">
      <input
        type="text"
        id="message-input"
        placeholder="Tell EvoMind something, or ask it anything..."
        autocomplete="off"
      />
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M3 12L21 4L13 21L11 13L3 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
