<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img src="evomind-logo.svg" alt="EvoMind logo" class="brand-logo" />
        <div class="brand-text">
          <h1>EvoMind</h1>
          <p>an evolving assistant, built by NeuraCraft</p>
        </div>
      </div>

      <div class="session-tag" id="session-tag">session · ...</div>

      <div class="menu-wrapper">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </button>

        <div class="dropdown-menu" id="dropdown-menu">
          <button class="menu-item" id="menu-theme">
            <span>🌓</span> Toggle theme
          </button>
          <button class="menu-item" id="menu-new-chat">
            <span>+</span> New chat
          </button>
          <button class="menu-item" id="menu-history">
            <span>🕘</span> History
          </button>
        </div>
      </div>
    </header>

    <main class="chat-window" id="chat-window">
      <div class="empty-state" id="empty-state">
        <img src="evomind-logo.svg" alt="EvoMind logo" class="empty-logo" />
        <p class="empty-title">Nothing remembered yet</p>
        <p class="empty-sub">Tell EvoMind something about yourself — it'll recall it later in this session.</p>
      </div>
    </main>

    <div class="typing-indicator" id="typing-indicator">
      <span class="typing-label">recalling</span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <form class="input-bar" id="chat-form">
      <input
        type="text"
        id="message-input"
        placeholder="Tell EvoMind something, or ask it anything..."
        autocomplete="off"
      />
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M3 12L21 4L13 21L11 13L3 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
